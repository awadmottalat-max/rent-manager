name: Release
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Create version tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh api repos/${{ github.repository }}/git/refs -f ref="refs/tags/v$V" -f sha="${{ github.sha }}" || echo "tag exists"
      - run: npx electron-builder --win --publish never
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release delete "v$V" --yes 2>/dev/null || true
          gh release create "v$V" "dist/Rent-Manager-Setup-$V.exe" "dist/Rent-Manager-Setup-$V.exe.blockmap" dist/latest.yml --title "v$V" --notes "إصدار $V" --latest
